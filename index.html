<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#183e38"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Your space to take progress one moment at a time."><title>My Progress</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><div class="shell"><main><h1 class="sr-only">My Progress</h1><nav role="tablist" aria-label="Progress trackers"><button id="tab-drinking" role="tab" aria-selected="true" aria-controls="tracker" data-track="drinking">Quit Drinking</button><button id="tab-smoking" role="tab" aria-selected="false" tabindex="-1" aria-controls="tracker" data-track="smoking">Quit Smoking</button><button id="tab-weed" role="tab" aria-selected="false" aria-controls="tracker" tabindex="-1" data-track="weed">Quit Weed</button><button id="tab-porn" role="tab" aria-selected="false" aria-controls="tracker" tabindex="-1" data-track="porn">Quit Porn</button></nav><section id="tracker" role="tabpanel" aria-labelledby="tab-drinking" tabindex="0"><div id="category-icon" class="category-icon" aria-hidden="true"></div>
<div class="count" aria-hidden="true"><strong id="days">—</strong><span id="unit">days</span></div>
<span id="day-description" class="sr-only">Last-use date not set</span>

<button class="edit" id="edit" aria-label="Set last-use date" title="Set last-use date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h4m-2-2v4"/></svg></button>
<div class="metrics"><div class="monthly"><div id="month-label">Progress this month <span id="month-detail"></span></div><span class="bar" aria-hidden="true"><span id="arc"></span></span></div><div class="months">Full Months Completed: <strong id="months">0</strong></div></div>
</section><p id="status" role="status"></p></main></div>
<dialog id="editor" aria-labelledby="edit-title"><form id="date-form"><div class="dialog-heading"><h2 id="edit-title">Set last use</h2><button type="button" class="close" id="cancel" aria-label="Close">×</button></div><p>Choose when you last used. Changing this only updates this tracker.</p><label for="last-input">Last-use date and time</label><input id="last-input" type="datetime-local" required step="60"><button type="button" class="secondary" id="now">Use right now</button><p class="error" id="error" role="alert"></p><button class="primary" type="submit">Save date &amp; restart timer</button></form></dialog></body></html>
